[package]
name = "thingi10k-browser"
version = "0.1.0"
edition = "2021"
default-run = "thingi10k-browser"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
csv = "1"
ureq = "2"
manifold-rust = { git = "https://github.com/larsbrubaker/manifold-rust" }
