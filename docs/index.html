<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thingi10K — 3D Model Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,700;1,9..144,300&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <aside id="sidebar">
      <div class="sidebar-header">
        <a class="header-link" href="https://github.com/larsbrubaker/Thingi10K" target="_blank" rel="noopener" title="View on GitHub">
          <h1>Thingi<span class="accent">10K</span></h1>
          <p class="subtitle">3D Model Archive</p>
        </a>
      </div>

      <div class="sidebar-body">
        <div class="search-wrap">
          <input type="search" id="search" placeholder="Search models…" autocomplete="off">
        </div>

        <details class="filter-section" id="filters-section" open>
          <summary>Filters</summary>
          <div class="filter-grid">
            <div class="filter-row">
              <span class="filter-row-label">Closed mesh</span>
              <div class="tri-group" data-filter="closed">
                <button class="tri-btn active" data-value="both">Both</button>
                <button class="tri-btn" data-value="true">Yes</button>
                <button class="tri-btn" data-value="false">No</button>
              </div>
            </div>
            <div class="filter-row">
              <span class="filter-row-label">Edge manifold</span>
              <div class="tri-group" data-filter="edge_manifold">
                <button class="tri-btn active" data-value="both">Both</button>
                <button class="tri-btn" data-value="true">Yes</button>
                <button class="tri-btn" data-value="false">No</button>
              </div>
            </div>
            <div class="filter-row">
              <span class="filter-row-label">Vertex manifold</span>
              <div class="tri-group" data-filter="vertex_manifold">
                <button class="tri-btn active" data-value="both">Both</button>
                <button class="tri-btn" data-value="true">Yes</button>
                <button class="tri-btn" data-value="false">No</button>
              </div>
            </div>
            <div class="filter-row">
              <span class="filter-row-label">Single component</span>
              <div class="tri-group" data-filter="single_component">
                <button class="tri-btn active" data-value="both">Both</button>
                <button class="tri-btn" data-value="true">Yes</button>
                <button class="tri-btn" data-value="false">No</button>
              </div>
            </div>
            <div class="filter-row">
              <span class="filter-row-label">PWN</span>
              <div class="tri-group" data-filter="pwn">
                <button class="tri-btn active" data-value="both">Both</button>
                <button class="tri-btn" data-value="true">Yes</button>
                <button class="tri-btn" data-value="false">No</button>
              </div>
            </div>
          </div>
        </details>

        <details class="filter-section" id="geo-section">
          <summary>Polygons</summary>
          <div class="poly-range-wrap">
            <div class="dual-range" id="dual-range">
              <div class="dual-range-track"></div>
              <div class="dual-range-fill" id="range-fill"></div>
              <div class="dual-range-thumb" id="poly-thumb-min"></div>
              <div class="dual-range-thumb" id="poly-thumb-max"></div>
            </div>
            <div class="poly-range-labels">
              <span id="poly-label-min">0</span>
              <span id="poly-label-max">0</span>
            </div>
          </div>
        </details>

        <div class="sort-row">
          <span class="sort-label">Sort</span>
          <div class="sort-buttons">
            <button class="sort-btn" data-key="id">ID <span class="arrow"></span></button>
            <button class="sort-btn" data-key="thing">Thing <span class="arrow"></span></button>
            <button class="sort-btn" data-key="name">Name <span class="arrow"></span></button>
          </div>
        </div>

        <div class="list-meta">
          <span id="model-count">Loading…</span>
        </div>

        <div id="model-list"></div>
      </div>
    </aside>

    <main id="main">
      <div id="viewer">
        <div id="viewer-placeholder">
          <div class="placeholder-inner">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 4L44 15V33L24 44L4 33V15L24 4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M24 4V44M4 15L24 26L44 15" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <p>Select a model to preview</p>
          </div>
        </div>

        <div id="viewer-loading">
          <div class="spinner"></div>
          <span>Loading mesh…</span>
        </div>

        <div id="viewer-toolbar">
          <button id="btn-wireframe">Wireframe</button>
        </div>
      </div>

      <section id="details">
        <p class="empty-details">Select a model from the list to see its details.</p>
      </section>
    </main>

  </div>
  <script src="app.js"></script>
</body>
</html>
